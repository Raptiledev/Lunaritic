# Publishes the deck/ folder to GitHub Pages on every push to main.
name: Publish deck to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "deck/**"
      - ".github/workflows/deck-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
        with:
          # Creates the Pages site on the first run when it does not exist yet.
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: deck
      - id: deployment
        uses: actions/deploy-pages@v4
